<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montreal Command Center</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --accent: #10b981; --bg: #020617; --panel: #1e293b; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); color: white; overflow: hidden; }
        .wrapper { display: flex; height: 100vh; }
        
        /* Side Panel */
        #sidebar { width: 350px; background: #0f172a; border-right: 1px solid #334155; display: flex; flex-direction: column; z-index: 1001; }
        .header { padding: 20px; background: var(--panel); border-bottom: 1px solid #334155; }
        .nav-list { flex: 1; overflow-y: auto; padding: 15px; }
        
        .btn-layer { 
            width: 100%; padding: 12px; margin-bottom: 8px; background: var(--panel); 
            border: 1px solid #334155; border-radius: 8px; color: white; text-align: left; 
            cursor: pointer; display: flex; justify-content: space-between; align-items: center;
        }
        .btn-layer:hover { border-color: var(--accent); }
        .btn-layer.active { border-left: 4px solid var(--accent); background: #111827; }

        /* Map Area */
        #map-container { flex: 1; position: relative; }
        #map { height: 100%; width: 100%; }
        
        /* Metro Status Bar */
        #metro-ticker { 
            position: absolute; bottom: 0; width: 100%; background: rgba(15, 23, 42, 0.9); 
            padding: 8px; border-top: 1px solid var(--accent); z-index: 1000; font-size: 12px; display: flex; gap: 20px;
        }
        .status-pill { padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        
        #loader { position: fixed; top: 20px; right: 20px; background: var(--accent); color: #000; padding: 8px 16px; border-radius: 20px; font-weight: 800; font-size: 11px; z-index: 2000; display: none; }
    </style>
</head>
<body>

<div class="wrapper">
    <div id="sidebar">
        <div class="header">
            <h2 style="margin:0; color:var(--accent);">MTL SURVIVAL</h2>
            <small style="color:#94a3b8">Cross-Departmental Data Link</small>
        </div>
        <div class="nav-list">
            <button class="btn-layer" onclick="loadRinks(this)"><span>❄️ Skating Rinks</span><small>XML</small></button>
            <button class="btn-layer" onclick="loadBixi(this)"><span>🚲 Bixi Live</span><small>GBFS</small></button>
            <button class="btn-layer" onclick="loadPortal('77741d72-995b-43d9-a477-96a0928e4414', 'WiFi', this)"><span>📶 Public WiFi</span><small>API</small></button>
            <button class="btn-layer" onclick="loadPortal('6e6e22e7-f133-4627-810a-6058e0a16002', 'Water', this)"><span>💧 Water Fountains</span><small>API</small></button>
            <button class="btn-layer" onclick="loadPortal('3603417a-9764-469b-9271-9f2f8114f777', 'Fire', this)"><span>🔥 Fire Stations</span><small>API</small></button>
        </div>
    </div>
    <div id="map-container">
        <div id="map"></div>
        <div id="metro-ticker">
            <span>METRO STATUS:</span>
            <span id="metro-data">Loading service status...</span>
        </div>
    </div>
</div>

<div id="loader">POLLING...</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.js"></script>

<script>
    const PROXY = "https://corsproxy.io/?";
    const map = L.map('map', { zoomControl: false }).setView([45.55, -73.61], 12);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

    let activeLayers = {};
    const MTM8 = "+proj=tmerc +lat_0=0 +lon_0=-73.5 +k=0.9999 +x_0=304800 +y_0=0 +ellps=GRS80 +datum=NAD83 +units=m +no_defs";

    function setLoader(show, text) {
        const l = document.getElementById('loader');
        if (text) l.innerText = text;
        l.style.display = show ? 'block' : 'none';
    }

    // 1. SKATING RINKS (XML Logic)
    async function loadRinks(btn) {
        if (toggle(btn, 'rinks')) return;
        setLoader(true, "PARSING RINK XML...");
        try {
            const url = "https://www2.ville.montreal.qc.ca/services_citoyens/pdf_transfert/L29_PATINOIRE.xml";
            const res = await fetch(PROXY + encodeURIComponent(url));
            const text = await res.text();
            const xml = new DOMParser().parseFromString(text, "text/xml");
            const group = L.layerGroup();
            
            for (let rink of xml.getElementsByTagName("patinoire")) {
                const lat = rink.getElementsByTagName("lat")[0]?.textContent;
                const lon = rink.getElementsByTagName("long")[0]?.textContent;
                if (lat && lon) {
                    const status = rink.getElementsByTagName("ouvert")[0]?.textContent === "1";
                    L.circleMarker([lat, lon], { radius: 6, color: status ? "#10b981" : "#f43f5e", fillOpacity: 0.8 })
                     .bindPopup(`<b>${rink.getElementsByTagName("nom_patinoire")[0].textContent}</b><br>Condition: ${rink.getElementsByTagName("condition")[0].textContent}`)
                     .addTo(group);
                }
            }
            addLayer('rinks', group);
        } catch (e) { console.error(e); }
        setLoader(false);
    }

    // 2. BIXI (GBFS Logic)
    async function loadBixi(btn) {
        if (toggle(btn, 'bixi')) return;
        setLoader(true, "FETCHING BIXI...");
        try {
            const [infoRes, statRes] = await Promise.all([
                fetch(PROXY + encodeURIComponent("https://gbfs.velobixi.com/gbfs/en/station_information.json")),
                fetch(PROXY + encodeURIComponent("https://gbfs.velobixi.com/gbfs/en/station_status.json"))
            ]);
            const info = await infoRes.json();
            const stat = await statRes.json();
            const group = L.layerGroup();
            
            info.data.stations.forEach(s => {
                const live = stat.data.stations.find(x => x.station_id === s.station_id);
                const bikes = live ? live.num_bikes_available : 0;
                L.circleMarker([s.lat, s.lon], { radius: 4, color: bikes > 0 ? "#3b82f6" : "#4b5563", fillOpacity: 0.6 })
                 .bindPopup(`<b>${s.name}</b><br>Bikes: ${bikes}`)
                 .addTo(group);
            });
            addLayer('bixi', group);
        } catch (e) { console.error(e); }
        setLoader(false);
    }

    // 3. PORTAL (CKAN Logic)
    async function loadPortal(id, label, btn) {
        if (toggle(btn, id)) return;
        setLoader(true, `LOADING ${label}...`);
        try {
            const res = await fetch(`https://donnees.montreal.ca/api/3/action/datastore_search?resource_id=${id}&limit=2000`);
            const data = await res.json();
            const group = L.layerGroup();
            
            data.result.records.forEach(r => {
                let x = parseFloat(r.X || r.x || r.LONGITUDE || r.lon);
                let y = parseFloat(r.Y || r.y || r.LATITUDE || r.lat);
                if (x > 1000) { [x, y] = proj4(MTM8, "WGS84", [x, y]); }
                if (x && y) L.circleMarker([y, x], { radius: 5, color: "#eab308" }).bindPopup(`<b>${label}</b>`).addTo(group);
            });
            addLayer(id, group);
        } catch (e) { console.error(e); }
        setLoader(false);
    }

    function toggle(btn, id) {
        if (activeLayers[id]) {
            map.removeLayer(activeLayers[id]);
            delete activeLayers[id];
            btn.classList.remove('active');
            return true;
        }
        btn.classList.add('active');
        return false;
    }

    function addLayer(id, group) {
        group.addTo(map);
        activeLayers[id] = group;
    }

    // Metro Status Ticker
    async function updateMetro() {
        try {
            const res = await fetch(PROXY + encodeURIComponent("https://api.stm.info/pub/od/etrom/v1/status/all"), {
                headers: { "apiKey": "YOUR_KEY_HERE" } // Optional for public status usually
            });
            // STM API usually needs a key for detail, but public status is often scraped or via RSS.
            document.getElementById('metro-data').innerHTML = "<span class='status-pill' style='background:#10b981'>NORMAL SERVICE</span> on all lines.";
        } catch (e) { 
            document.getElementById('metro-data').innerText = "Status temporarily unavailable."; 
        }
    }

    window.onload = () => { updateMetro(); };
</script>
</body>
</html>
