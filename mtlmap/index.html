<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montreal Survival Map - Master Catalog</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: 'Segoe UI', sans-serif; background: #121212; color: #e0e0e0; }
        
        /* Header & Search */
        .header { padding: 15px; background: #1f2937; display: flex; gap: 15px; align-items: center; z-index: 1001; border-bottom: 2px solid #374151; }
        #apiSearch { flex-grow: 1; padding: 12px; border-radius: 6px; border: 1px solid #4b5563; background: #374151; color: white; font-size: 15px; }
        
        .main-container { display: flex; flex-grow: 1; overflow: hidden; }
        
        /* Sidebar Catalog */
        #catalog { 
            width: 350px; 
            background: #181818; 
            border-right: 1px solid #333; 
            overflow-y: auto; 
            padding: 15px;
            display: flex;
            flex-direction: column;
        }
        .catalog-title { color: #10b981; margin-top: 0; font-size: 18px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        
        #catalogList { flex-grow: 1; }

        .catalog-item {
            padding: 12px;
            margin-bottom: 8px;
            background: #262626;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }
        .catalog-item:hover { background: #333; border-color: #10b981; }
        .catalog-item.active { border-left: 5px solid #10b981; background: #1e2925; color: #fff; }
        .catalog-item small { display: block; color: #9ca3af; margin-top: 4px; font-style: italic; }

        /* Map Area */
        #map { flex-grow: 1; background: #111; }
        
        #status-bar { padding: 5px 15px; background: #10b981; color: #000; font-size: 12px; font-weight: bold; position: fixed; bottom: 0; right: 0; z-index: 1002; border-top-left-radius: 8px; }

        /* Scrollbar Styling */
        #catalog::-webkit-scrollbar { width: 6px; }
        #catalog::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
    </style>
</head>
<body>

<div class="header">
    <strong style="color: #10b981; font-size: 1.2rem;">MTL DATA MASTER</strong>
    <input type="text" id="apiSearch" placeholder="Search the catalog (e.g., Water, Skating, Parks, Fire)..." onkeyup="filterCatalog()">
</div>

<div class="main-container">
    <div id="catalog">
        <h4 class="catalog-title">Montreal Catalog</h4>
        <div id="catalogList">Initializing scan...</div>
    </div>
    <div id="map"></div>
</div>

<div id="status-bar">Ready</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pmtiles@2.11.0/dist/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/protomaps-leaflet@4.0.1/dist/protomaps-leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.js"></script>

<script>
    let map, layerControl;
    let loadedLayers = {}; 
    const MTM8 = "+proj=tmerc +lat_0=0 +lon_0=-73.5 +k=0.9999 +x_0=304800 +y_0=0 +ellps=GRS80 +datum=NAD83 +units=m +no_defs";
    const WGS84 = "WGS84";

    function updateStatus(msg) { document.getElementById('status-bar').innerText = msg; }

    function initMap() {
        if (typeof protomapsL === 'undefined') { setTimeout(initMap, 200); return; }
        
        map = L.map('map').setView([45.5088, -73.5878], 12);
        
        // Base Layers
        const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        const pmtiles = protomapsL.leafletLayer({ url: "./montreal.pmtiles", theme: "dark" });

        layerControl = L.control.layers({ "Online": osm, "Offline": pmtiles }, {}, { collapsed: false }).addTo(map);

        buildCatalog();
    }

    async function buildCatalog() {
        const listContainer = document.getElementById('catalogList');
        updateStatus("Fetching data packages...");

        // Fetching top 300 results that include CSV (the most map-friendly format)
        const url = `https://donnees.montreal.ca/api/3/action/package_search?q=format:CSV&rows=300`;
        
        try {
            const res = await fetch(url);
            const data = await res.json();
            listContainer.innerHTML = "";

            data.result.results.forEach(pkg => {
                const csvRes = pkg.resources.find(r => r.format.toLowerCase() === 'csv');
                if (csvRes) {
                    const item = document.createElement('div');
                    item.className = 'catalog-item';
                    item.innerHTML = `<strong>${pkg.title}</strong><small>${pkg.organization.title}</small>`;
                    item.onclick = () => toggleLayer(pkg.title, csvRes.id, item);
                    listContainer.appendChild(item);
                }
            });
            updateStatus("300+ Datasets Loaded");
        } catch (e) {
            listContainer.innerHTML = "Portal connection failed.";
        }
    }

    async function toggleLayer(title, resourceId, element) {
        if (loadedLayers[resourceId]) {
            map.removeLayer(loadedLayers[resourceId].group);
            layerControl.removeLayer(loadedLayers[resourceId].group);
            delete loadedLayers[resourceId];
            element.classList.remove('active');
            updateStatus(`Removed: ${title}`);
        } else {
            element.classList.add('active');
            updateStatus(`Loading points for ${title}...`);
            const group = await fetchPoints(resourceId, title);
            if (group) {
                loadedLayers[resourceId] = { group, title };
                updateStatus(`Active: ${title}`);
            } else {
                element.classList.remove('active');
                updateStatus("Error: No valid map data found.");
            }
        }
    }

    async function fetchPoints(resourceId, label) {
        // Montreal Datastore Search
        const apiUrl = `https://donnees.montreal.ca/api/3/action/datastore_search?resource_id=${resourceId}&limit=5000`;
        const group = L.layerGroup();
        
        try {
            const res = await fetch(apiUrl);
            const data = await res.json();
            let count = 0;

            data.result.records.forEach(record => {
                // Coordinate Hunter: Checks Lat/Lon, x/y, and X/Y
                let x = parseFloat(record.X || record.x || record.LONGITUDE || record.lon || record.Longitude);
                let y = parseFloat(record.Y || record.y || record.LATITUDE || record.lat || record.Latitude);

                if (!isNaN(x) && !isNaN(y)) {
                    let lat = y, lon = x;
                    
                    // Automatic MTM8 Conversion for Meter-based coords (like skating rinks)
                    if (x > 1000) {
                        const conv = proj4(MTM8, WGS84, [x, y]);
                        lon = conv[0]; lat = conv[1];
                    }

                    // Only plot if it falls within the Montreal Island bounding area
                    if (lat > 45.3 && lat < 45.8) {
                        L.circleMarker([lat, lon], { 
                            radius: 7, 
                            fillColor: "#10b981", 
                            color: "#fff", 
                            weight: 1, 
                            fillOpacity: 0.8 
                        })
                        .bindPopup(`<strong>${label}</strong><br>${record.NOM || record.NOM_TEMP || record.Nom || "Resource"}`)
                        .addTo(group);
                        count++;
                    }
                }
            });

            if (count > 0) {
                group.addTo(map);
                layerControl.addOverlay(group, label);
                return group;
            }
            return null;
        } catch (e) { return null; }
    }

    // Live filter of the sidebar list
    function filterCatalog() {
        const query = document.getElementById('apiSearch').value.toLowerCase();
        const items = document.querySelectorAll('.catalog-item');
        items.forEach(item => {
            const text = item.innerText.toLowerCase();
            item.style.display = text.includes(query) ? 'block' : 'none';
        });
    }

    window.onload = initMap;
</script>
</body>
</html>
