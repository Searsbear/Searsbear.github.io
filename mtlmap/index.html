<!DOCTYPE html>
<html lang="en">
<head>
    <title>MTL Survival Map - Hybrid</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; }
        #map { width: 100%; height: 100vh; background: #f0f0f0; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pmtiles@2.11.0/dist/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/protomaps-leaflet@4.0.1/dist/protomaps-leaflet.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <script>
        let map;
        let overlayLayers = {}; // This will hold your CSV categories (e.g., Police, Food)

        function initMap() {
            if (typeof protomapsL === 'undefined') {
                setTimeout(initMap, 200);
                return;
            }

            map = L.map('map').setView([45.5088, -73.5878], 13);

            // 1. BASE LAYERS
            const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            const pmtilesLayer = protomapsL.leafletLayer({
                url: "./montreal.pmtiles",
                theme: "white" 
            });

            const baseMaps = {
                "Online (OSM)": osmLayer,
                "Offline (PMTiles)": pmtilesLayer
            };

            // 2. CSV LAYER CONFIGURATION
            // Add your file names here. 'color' is used if the CSV doesn't specify a type.
            const layerConfigs = [
                { name: "Police Stations", url: "spvm.csv", defaultType: "legal" },
                { name: "Resource Centers", url: "resources.csv", defaultType: "Legal" }
                // To add more, just copy the line above and change the name/url
            ];

            // 3. COLOR LOGIC (Your Categories)
            function getColor(type) {
                switch(type) {
                    case 'Legal':     return "#10b981"; 
                    case 'Crisis':    return "#f43f5e";
                    case 'Transport': return "#f59e0b";  
                    case 'Life':      return "#94a3b8";
                    default:          return "#f1c40f"; // Yellow
                }
            }

            // 4. LOAD CSVs
            layerConfigs.forEach(config => {
                const group = L.layerGroup();
                overlayLayers[config.name] = group;

                Papa.parse(config.url, {
                    download: true,
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        results.data.forEach(row => {
                            // Support various coordinate names (MTL uses LATITUDE/LONGITUDE)
                            const lat = parseFloat(row.LATITUDE || row.lat || row.Latitude);
                            const lon = parseFloat(row.LONGITUDE || row.lon || row.Longitude);
                            const type = row.type || config.defaultType;
                            const name = row.name || row.NOM_TEMP || "Unknown Location";

                            if (!isNaN(lat) && !isNaN(lon)) {
                                L.circleMarker([lat, lon], {
                                    radius: 9,
                                    fillColor: getColor(type),
                                    color: "#ffffff",
                                    weight: 2,
                                    fillOpacity: 0.9
                                })
                                .addTo(group)
                                .bindPopup(`<strong>${name}</strong><br>Category: ${type}`);
                            }
                        });
                    }
                });
            });

            // 5. ADD CONTROL MENU
            L.control.layers(baseMaps, overlayLayers, { collapsed: false }).addTo(map);
        }

        window.onload = initMap;
    </script>
</body>
</html>
