<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montreal Survival Map - CKAN Live</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #111; color: white; }
        
        /* Dashboard Styling */
        .dashboard {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 15px;
            background: #222;
            border-bottom: 2px solid #444;
            align-items: center;
        }

        #apiSearch {
            flex-grow: 1;
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #555;
            background: #333;
            color: white;
            min-width: 250px;
        }

        button {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-search { background: #3498db; color: white; }
        .btn-search:hover { background: #2980b9; }

        .btn-clear { background: #e74c3c; color: white; }
        .btn-clear:hover { background: #c0392b; }

        #map { height: calc(100vh - 75px); width: 100%; }

        /* Custom Popup Style */
        .leaflet-popup-content-wrapper { background: #333; color: white; border-radius: 8px; }
        .leaflet-popup-tip { background: #333; }
    </style>
</head>
<body>

<div class="dashboard">
    <strong>Montreal CKAN Explorer:</strong>
    <input type="text" id="apiSearch" placeholder="Search (e.g. Bixi, WiFi, Arbres, Patinoires)...">
    <button class="btn-search" onclick="searchCKAN()">Search & Add</button>
    <button class="btn-clear" onclick="clearExtraLayers()">Clear Search Layers</button>
</div>

<div id="map"></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pmtiles@2.11.0/dist/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/protomaps-leaflet@4.0.1/dist/protomaps-leaflet.min.js"></script>

<script>
    let map;
    let layerControl;
    let extraLayers = []; // To track dynamically added layers

    // 1. SURVIVAL CORE CONFIGURATION
    const survivalResources = [
        { name: "Police Stations", id: "67010a30-6b60-449b-8254-2b6299b92784", color: "#f43f5e", type: "Crisis" },
        { name: "Fire Stations", id: "054619a9-3079-43c2-985f-8700a4d44093", color: "#f43f5e", type: "Crisis" },
        { name: "Drinking Water", id: "5f1da76b-2788-4ca4-bf23-f39b1a030043", color: "#3498db", type: "Life" }
    ];

    // Initialize Map
    function initMap() {
        // Fallback for Protomaps loading
        if (typeof protomapsL === 'undefined') { setTimeout(initMap, 200); return; }

        map = L.map('map').setView([45.5088, -73.5878], 12);

        // Base Layers
        const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        const pmtiles = protomapsL.leafletLayer({ 
            url: "./montreal.pmtiles", 
            theme: "dark" // Survival theme
        });

        // Layer Control
        layerControl = L.control.layers({ 
            "Online (OSM)": osm, 
            "Offline (PMTiles)": pmtiles 
        }, {}, { collapsed: false }).addTo(map);

        // Load the Survival Core immediately
        survivalResources.forEach(res => {
            loadFromCKAN(res, false);
        });
    }

    // 2. CKAN SEARCH FUNCTION
    async function searchCKAN() {
        const query = document.getElementById('apiSearch').value;
        if (!query) return;

        // Search the Montreal package catalog
        const searchUrl = `https://donnees.montreal.ca/api/3/action/package_search?q=${encodeURIComponent(query)}&rows=1`;
        
        try {
            const res = await fetch(searchUrl);
            const data = await res.json();
            
            if (data.result.results.length > 0) {
                const pkg = data.result.results[0];
                // Locate the CSV resource (easiest to parse for lat/lon)
                const csvRes = pkg.resources.find(r => r.format.toLowerCase() === 'csv');
                
                if (csvRes) {
                    const newLayer = { 
                        name: pkg.title, 
                        id: csvRes.id, 
                        color: "#f1c40f", 
                        type: "Search Result" 
                    };
                    loadFromCKAN(newLayer, true);
                } else {
                    alert("Found dataset, but no compatible CSV resource exists for mapping.");
                }
            } else {
                alert("No results found for that search term.");
            }
        } catch (e) {
            console.error("CKAN Search Error:", e);
        }
    }

    // 3. DATA LOADING & PLOTTING
    async function loadFromCKAN(resConfig, isExtra) {
        const group = L.layerGroup();
        const apiUrl = `https://donnees.montreal.ca/api/3/action/datastore_search?resource_id=${resConfig.id}&limit=1000`;

        try {
            const response = await fetch(apiUrl);
            const data = await response.json();
            
            if (data.success) {
                let count = 0;
                data.result.records.forEach(record => {
                    // Normalize various coordinate field names used by different city depts
                    const lat = parseFloat(record.LATITUDE || record.lat || record.Latitude);
                    const lon = parseFloat(record.LONGITUDE || record.lon || record.Longitude);
                    const name = record.NOM || record.NOM_TEMP || record.Nom || "Resource";

                    if (!isNaN(lat) && !isNaN(lon)) {
                        L.circleMarker([lat, lon], {
                            radius: 8,
                            fillColor: resConfig.color,
                            color: "#fff",
                            weight: 2,
                            fillOpacity: 0.8
                        })
                        .bindPopup(`
                            <div style="color:black">
                                <strong>${name}</strong><br>
                                <small>Source: ${resConfig.name}</small>
                            </div>
                        `)
                        .addTo(group);
                        count++;
                    }
                });

                if (count > 0) {
                    group.addTo(map);
                    layerControl.addOverlay(group, resConfig.name);
                    
                    if (isExtra) {
                        extraLayers.push({ group, name: resConfig.name });
                    }
                } else {
                    console.warn(`Layer ${resConfig.name} loaded but had no valid coordinates.`);
                }
            }
        } catch (e) {
            console.error(`Fetch error for ${resConfig.name}:`, e);
        }
    }

    // 4. CLEANUP FUNCTION
    function clearExtraLayers() {
        extraLayers.forEach(layer => {
            map.removeLayer(layer.group);
            layerControl.removeLayer(layer.group);
        });
        extraLayers = [];
        document.getElementById('apiSearch').value = "";
    }

    window.onload = initMap;
</script>

</body>
</html>
