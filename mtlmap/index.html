<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montreal Universal Survival Map</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.js"></script>

    <style>
        :root { --accent: #10b981; --bg: #0f172a; --panel: #1e293b; --text: #f8fafc; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
        
        .layout { display: flex; flex-direction: column; height: 100vh; }
        
        /* Top Navigation */
        .navbar { 
            background: var(--panel); 
            padding: 12px 20px; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            border-bottom: 1px solid #334155; 
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .logo { color: var(--accent); font-weight: 900; letter-spacing: 1px; font-size: 1.2rem; }
        #searchBar { flex-grow: 1; padding: 10px 15px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; transition: 0.2s; }
        #searchBar:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2); }
        .btn { background: var(--accent); color: #020617; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; }
        .btn:hover { filter: brightness(1.1); }

        .content { display: flex; flex: 1; overflow: hidden; }

        /* Sidebar Catalog */
        #sidebar { width: 350px; background: #020617; border-right: 1px solid #1e293b; display: flex; flex-direction: column; }
        #catalog { flex: 1; overflow-y: auto; padding: 15px; }
        
        .card { 
            background: #1e293b; 
            padding: 14px; 
            margin-bottom: 12px; 
            border-radius: 10px; 
            cursor: pointer; 
            border: 1px solid transparent; 
            transition: 0.2s;
        }
        .card:hover { border-color: var(--accent); background: #334155; }
        .card.active { border-left: 5px solid var(--accent); background: #111827; }
        .card b { display: block; font-size: 14px; margin-bottom: 4px; color: var(--accent); }
        .card small { font-size: 11px; color: #94a3b8; }

        /* Map & Overlay */
        #map { flex: 1; z-index: 1; }
        #loader { 
            position: fixed; 
            bottom: 25px; 
            right: 25px; 
            background: var(--accent); 
            color: #020617; 
            padding: 8px 16px; 
            border-radius: 30px; 
            font-size: 12px; 
            font-weight: 800; 
            z-index: 9999; 
            display: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .legend {
            position: absolute;
            bottom: 80px;
            right: 20px;
            background: rgba(30, 41, 59, 0.9);
            padding: 10px;
            border-radius: 8px;
            font-size: 11px;
            z-index: 1000;
            border: 1px solid #334155;
        }
        .legend-item { display: flex; align-items: center; margin-bottom: 5px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
    </style>
</head>
<body>

<div class="layout">
    <div class="navbar">
        <div class="logo">MTL MASTER</div>
        <input type="text" id="searchBar" placeholder="Search (e.g. Skating, Fire Stations, Wifi, Water)...">
        <button class="btn" onclick="runGlobalSearch()">SEARCH</button>
    </div>

    <div class="content">
        <div id="sidebar">
            <div id="catalog">
                <div style="padding: 40px; text-align: center; color: #475569;">
                    <p>Ready to explore live Montreal data.</p>
                </div>
            </div>
        </div>
        <div id="map">
            <div class="legend">
                <div class="legend-item"><div class="dot" style="background:#10b981"></div> Open / Good</div>
                <div class="legend-item"><div class="dot" style="background:#f43f5e"></div> Closed / Warning</div>
                <div class="legend-item"><div class="dot" style="background:#3b82f6"></div> Neutral / Info</div>
            </div>
        </div>
    </div>
</div>

<div id="loader">POLLING APIS...</div>

<script>
    let map, layerControl;
    let activeLayers = {};
    
    // Montreal Local Meter Projection (MTM8)
    const MTM8 = "+proj=tmerc +lat_0=0 +lon_0=-73.5 +k=0.9999 +x_0=304800 +y_0=0 +ellps=GRS80 +datum=NAD83 +units=m +no_defs";
    const WGS84 = "WGS84";

    // 1. Initialize Leaflet
    function init() {
        map = L.map('map', { zoomControl: false }).setView([45.558, -73.610], 12);
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; CARTO'
        }).addTo(map);

        layerControl = L.control.layers({}, {}, { collapsed: false }).addTo(map);
    }

    // 2. Global Search Router
    async function runGlobalSearch() {
        const query = document.getElementById('searchBar').value.trim().toLowerCase();
        if (!query) return;

        toggleLoader(true, "SEARCHING PORTAL...");
        const catalog = document.getElementById('catalog');
        catalog.innerHTML = "";

        // Translation logic for Montreal's French portal
        const dictionary = {
            "skating": "patinoire", "rink": "patinoire", "water": "fontaine",
            "fire": "pompier", "police": "police", "wifi": "wifi", "park": "parc"
        };
        const searchTerm = dictionary[query] || query;

        try {
            const res = await fetch(`https://donnees.montreal.ca/api/3/action/package_search?q=${encodeURIComponent(searchTerm)}&rows=40`);
            const data = await res.json();

            if (data.result.results.length === 0) {
                catalog.innerHTML = `<p style="text-align:center; padding:20px;">No results found for "${query}".</p>`;
            }

            data.result.results.forEach(pkg => {
                const resource = pkg.resources.find(r => ['csv', 'geojson'].includes(r.format.toLowerCase()));
                if (resource) {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `<span>${resource.format} • ${pkg.organization.title}</span><b>${pkg.title}</b>`;
                    card.onclick = () => processLayer(resource.id, pkg.title, card);
                    catalog.appendChild(card);
                }
            });
        } catch (err) {
            catalog.innerHTML = `<p>Error connecting to Montreal Open Data.</p>`;
        } finally {
            toggleLoader(false);
        }
    }

    // 3. Universal Data Parser (The Heavy Lifter)
    async function processLayer(id, title, element) {
        if (activeLayers[id]) {
            map.removeLayer(activeLayers[id]);
            layerControl.removeOverlay(activeLayers[id]);
            delete activeLayers[id];
            element.classList.remove('active');
            return;
        }

        toggleLoader(true, "DOWNLOADING DATA...");
        element.classList.add('active');

        try {
            const response = await fetch(`https://donnees.montreal.ca/api/3/action/datastore_search?resource_id=${id}&limit=6000`);
            const data = await response.json();
            const layerGroup = L.layerGroup();
            let count = 0;

            data.result.records.forEach(record => {
                let x, y;

                // HEURISTIC 1: Check for GeoJSON "geometry" field (nested object/string)
                if (record.geometry) {
                    try {
                        const geom = (typeof record.geometry === 'string') ? JSON.parse(record.geometry) : record.geometry;
                        if (geom.coordinates) [x, y] = geom.coordinates;
                    } catch(e) {}
                }

                // HEURISTIC 2: Check for WKT (Well-Known Text) string
                if (!x && record.the_geom && record.the_geom.includes("POINT")) {
                    const match = record.the_geom.match(/\(([^)]+)\)/);
                    if (match) [x, y] = match[1].split(" ").map(parseFloat);
                }

                // HEURISTIC 3: Flat Columns (Lat/Lon/X/Y)
                if (!x) {
                    x = parseFloat(record.X || record.x || record.LONGITUDE || record.lon || record.Longitude || record.LONG);
                    y = parseFloat(record.Y || record.y || record.LATITUDE || record.lat || record.Latitude || record.LAT);
                }

                if (x && y) {
                    // COORDINATE TRANSFORMATION
                    // If x > 1000, it's definitely MTM8 (meters)
                    if (Math.abs(x) > 1000) {
                        const converted = proj4(MTM8, WGS84, [x, y]);
                        [x, y] = converted;
                    }

                    // CONDITION-BASED STYLING (The RinkClic Logic)
                    let color = "#3b82f6"; // Default Blue
                    let popupInfo = "";

                    // Check for Status (Open/Closed)
                    if (record.OUVERT === "0" || record.OUVERTURE === "Non" || record.STATUT === "Fermé") {
                        color = "#f43f5e"; // Red
                    } else if (record.OUVERT === "1" || record.OUVERTURE === "Oui") {
                        color = "#10b981"; // Green
                    }

                    if (record.CONDITION) popupInfo += `<br><span style="color:#94a3b8">Condition: ${record.CONDITION}</span>`;
                    if (record.DESCRIPTION) popupInfo += `<br><small>${record.DESCRIPTION}</small>`;

                    L.circleMarker([y, x], {
                        radius: 7,
                        fillColor: color,
                        color: "#fff",
                        weight: 1,
                        fillOpacity: 0.8
                    }).bindPopup(`
                        <div style="font-family:sans-serif; color:white;">
                            <b style="color:${color}">${title}</b><br>
                            <strong>${record.NOM || record.NOM_ATOME || "Location"}</strong>
                            ${popupInfo}
                        </div>
                    `, { backgroundColor: '#1e293b' }).addTo(layerGroup);
                    count++;
                }
            });

            if (count > 0) {
                layerGroup.addTo(map);
                layerControl.addOverlay(layerGroup, title);
                activeLayers[id] = layerGroup;
                toggleLoader(true, `SUCCESS: ${count} POINTS PLOTTED`);
                setTimeout(() => toggleLoader(false), 2000);
            } else {
                alert("File loaded, but no valid coordinates found for map display.");
                element.classList.remove('active');
                toggleLoader(false);
            }
        } catch (err) {
            console.error(err);
            toggleLoader(false);
        }
    }

    function toggleLoader(show, text) {
        const l = document.getElementById('loader');
        if (text) l.innerText = text;
        l.style.display = show ? 'block' : 'none';
    }

    // Trigger search on Enter
    document.getElementById('searchBar').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') runGlobalSearch();
    });

    window.onload = init;
</script>

</body>
</html>
